    <title>node-tts-deck-builder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

  <body>
    <div class="tabs is-centered p-0 m-0">
      <ul>
        <li class="is-active">
          <a>
            <span class="icon is-small"
              ><i class="mdi mdi-cards-playing" aria-hidden="true"></i
            ></span>
            <strong>Deck Builder</strong>
          </a>
        </li>
         <li>
          <a>
            <span class="icon is-small"
              ><i class="mdi mdi-cog" aria-hidden="true"></i
            ></span>
            <strong>Settings</strong>
          </a>
        </li>
      </ul>
    </div>

    <div class="p-5" id="deck-list-container">
      <article class="message">
        <div class="message-header">
          <p>How it works</p>
        </div>
        <div class="message-body">
          Simply <strong>drag and drop</strong> your card images (.png, .jpeg) below. When you're ready, click Export to generate a deck formatted for <strong>Tabletop Simulator</strong>.
        </div>
      </article>

      <div class="modal" id="modal-card-image">
        <div class="modal-background" id="modal-card-bg"></div>
        <div class="modal-content" style="pointer-events: none;">
          <figure class="image">
            <img src="/Users/ruth/Downloads/M7XJ_PTBR_243-2x.png" alt="">
          </figure>
        </div>
      </div>

      <!-- <div class="modal" id="drag-and-drop-modal" style="pointer-events: none;">

        <div class="modal-content">

            <h1 class="title">Looks good!</h1>
            <h2 class="subtitle">
              Now just drop the images here to upload them.
            </h2>
          </section>
        </div>
      </div> -->
      
      <div class="fixed-grid has-8-cols">
        <div class="grid">
          <div class="cell">
            <figure class="image">
              <img src="/Users/ruth/Downloads/M7XJ_PTBR_243-2x.png" alt="" draggable="false">
            </figure>
             <span class="icon is-small is-medium has-text-danger"
              ><i class="mdi mdi-delete" aria-hidden="true"></i
            ></span>
            <span class="icon is-small is-medium"
              ><i class="mdi mdi-dots-vertical" aria-hidden="true"></i
            ></span>
          </div>
        </div>
      </div>

      <button class="button is-primary" aria-label="close" id="btn-card-image">abrir modal</button>

      <h1>texto aqui</h1>
