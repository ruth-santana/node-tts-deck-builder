    <title>node-tts-deck-builder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

  <body>
    <div class="tabs is-centered p-0 m-0">
      <ul>
        <li class="is-active">
          <a>
            <span class="icon is-small"
              ><i class="mdi mdi-cards-playing" aria-hidden="true"></i
            ></span>
            <strong>Deck Builder</strong>
          </a>
        </li>
         <li>
          <a>
            <span class="icon is-small"
              ><i class="mdi mdi-cog" aria-hidden="true"></i
            ></span>
            <strong>Settings</strong>
          </a>
        </li>
      </ul>
    </div>

    <div class="p-5">
      <article class="message">
        <div class="message-header">
          <p>An error has occurred</p>
        </div>
        <div class="message-body">
          The app couldn't generate your image. It might be too heavy or has invalid files.
        </div>
      </article>

      <div class="modal" id="modal-card-image">
        <div class="modal-background" id="modal-card-bg"></div>
        <div class="modal-content" style="pointer-events: none;">
          <figure class="image">
            <img src="/Users/ruth/Downloads/07QFYyO.png" alt="">
          </figure>
        </div>
      </div>

      <button class="button is-primary" aria-label="close" id="btn-card-image">abrir modal</button>

      <h1>texto aqui</h1>
      <button id="butao" class="button is-primary">clique aqui</button>
    </div>

    <script src="./renderer.js" type="module"></script>
